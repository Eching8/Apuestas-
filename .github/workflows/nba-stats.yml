name: NBA stats.nba.com

# Descarga de stats.nba.com (enfrentamientos defensor-atacante y estadísticas avanzadas).
on:
  push:
    branches: [nba-props]
    paths: [".github/workflows/nba-stats.yml"]
  workflow_dispatch:

jobs:
  conexion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probar conexión con stats.nba.com
        run: |
          curl -sS -m 40 -o /tmp/r.json -w "HTTP %{http_code} en %{time_total}s\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Referer: https://www.nba.com/" -H "Origin: https://www.nba.com" -H "Accept: application/json, text/plain, */*" \
            -H "x-nba-stats-origin: stats" -H "x-nba-stats-token: true" \
            "https://stats.nba.com/stats/boxscorematchupsv3?GameID=0022500001" || echo "SIN RESPUESTA"
          head -c 400 /tmp/r.json || true

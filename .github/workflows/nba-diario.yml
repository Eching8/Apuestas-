name: NBA diario

# Cada día en los servidores de GitHub: guarda los resultados de ayer, liquida las props, baja lesiones y
# líneas de hoy y publica el informe en la rama nba-informes (nba/AAAA-MM-DD.md y ultimo.md).
# La base de datos se conserva entre ejecuciones con la caché de Actions; si se pierde, se reconstruye
# sola desde ESPN (~15 min). stats.nba.com no responde a estos servidores, así que no se usa aquí.
on:
  schedule:
    # 8:43 en Bogotá (13:43 UTC): GitHub suele retrasar unos minutos los horarios, así el informe está
    # listo hacia las 9:00.
    - cron: "43 13 * * *"
  workflow_dispatch:
  push:
    branches: [nba-props]
    paths: [".github/workflows/nba-diario.yml"]

concurrency:
  group: nba-diario
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
      APUESTAS_TZ: America/Bogota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Solo lo que usa apuestas/nba (requirements.txt incluye también las librerías pesadas de nbaev).
      - run: python -m pip install "requests>=2.31"
      - name: Recuperar la base
        uses: actions/cache/restore@v4
        with:
          path: data/apuestas.db
          key: nba-db-${{ github.run_id }}
          restore-keys: nba-db-
      - name: Historial de ESPN (desde el último día guardado)
        run: python -m apuestas nba historial
      - name: Props del día
        run: python -m apuestas nba analizar --top 25
      - name: Resultados acumulados
        run: python -m apuestas nba rendimiento
      - name: Guardar la base
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/apuestas.db
          key: nba-db-${{ github.run_id }}
      - name: Publicar el informe en la rama nba-informes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ultimo=$(ls -t reportes/nba/*.md | head -1)
          mkdir publicar && cd publicar
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin nba-informes; then git checkout -q -b nba-informes FETCH_HEAD; else git checkout -q --orphan nba-informes; fi
          mkdir -p nba
          cp ../reportes/nba/*.md ../reportes/nba/*.json nba/
          cp "../$ultimo" ultimo.md
          git add -A
          git commit -q -m "Informe NBA $(basename "$ultimo" .md)" || exit 0
          git push -q origin nba-informes
      - uses: actions/upload-artifact@v4
        with:
          name: informe-nba-${{ github.run_number }}
          path: reportes/nba/
          retention-days: 30
